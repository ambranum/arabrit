  .askpop-sel{flex:1; font-size:12.5px; line-height:1.5; color:var(--muted);
    max-height:52px; overflow:hidden}
  .askpop-x{flex:none; border:none; background:none; color:var(--muted); cursor:pointer;
    font-size:20px; line-height:1; padding:0 2px}
  .askpop-x:hover{color:var(--ink)}
  .askpop-log{flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 12px;
    font-size:13.5px; line-height:1.62}
  .askpop-q{font-family:var(--sans); font-size:12px; font-weight:600; color:var(--verdigris);
    margin:8px 0 4px}
  .askpop-q:first-child{margin-top:0}
  .askpop-a{color:var(--ink)}
  .askpop-a.err{color:var(--rubric)}
  .askpop-chips{display:flex; flex-wrap:wrap; gap:6px; padding:9px 10px 4px}
  .askpop-chips button{font-family:var(--sans); font-size:11.5px; padding:5px 10px;
    border:1px solid var(--rule); border-radius:999px; background:none; color:var(--ink);
    cursor:pointer}
  .askpop-chips button:hover{border-color:var(--verdigris); color:var(--verdigris)}
  .askpop-ask{display:flex; align-items:center; gap:6px; padding:6px 10px 10px}
  .askpop-ask input{flex:1; min-width:0; font:inherit; font-size:13px; padding:7px 9px;
    border:1px solid var(--rule); border-radius:8px; background:var(--paper); color:var(--ink)}
  .askpop-ask button[type=submit]{font-family:var(--sans); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:8px; border:1px solid var(--verdigris);
    background:var(--verdigris); color:var(--paper); cursor:pointer}
  .askpop-ask button[disabled]{opacity:.5; cursor:default}
  .askpop-nokey{margin:0; padding:10px 12px; font-size:12.5px; color:var(--muted)}
  .askpop-nokey a{color:var(--verdigris); font-weight:600}
  .askpop-full{display:block; padding:8px 12px 10px; border-top:1px solid var(--rule);
    font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--verdigris)}
  @media print{.askpop{display:none}}

  /* ---- language switcher: one flag per registered pack, in the top bar ---- */
  .langsw{display:inline-flex; gap:4px; align-items:center; margin-inline-end:10px}
  .langsw-b{display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    padding:4px 9px; border-radius:999px; border:1px solid var(--rule);
    background:none; color:var(--muted); font-family:var(--sans); font-size:11.5px;
    font-weight:600; line-height:1; letter-spacing:.02em}
  .langsw-b:hover{border-color:var(--verdigris); color:var(--ink)}

  .langsw-f{font-size:14px; line-height:1}
  @media (max-width:560px){ .langsw-n{display:none} .langsw-b{padding:4px 7px} }
  @media print{ .langsw{display:none} }

  /* Doubled class = specificity (0,2,0), deliberately. arLive() drops spans into containers
     that were written before it existed, and some of them style their descendants by ELEMENT:
     `.lsn-gx span{display:block}` caught every injected word and stacked a grammar example one
     word per line. These rules have to outrank a plain `.thing span` selector wherever they land,
     so the inserted markup stays invisible to layout — a run of text, exactly as before. */
  .lx.lx{display:inline}
  .lx .pu{display:inline; font-size:inherit; color:inherit}
  .lx .lw{display:inline-block; padding:1px 2px; line-height:inherit; font-size:inherit}
  .lx .lw.gap{border-bottom:1px dotted var(--paper-3)}
  .wcut{font-size:12px; color:var(--muted); margin:-4px 0 8px; font-family:var(--sans)}
  .wc-banks{margin-top:9px; font-size:11.5px; line-height:1.5; color:var(--muted); font-family:var(--sans)}

  /* ---- section hero: wordmark, then an engraved scene, like the home masthead ---- */
  .sh{position:relative; margin:-4px 0 18px}
  .sh-in{display:flex; flex-direction:column; gap:2px; padding:14px 0 10px}
  /* The section's own name drawn large — a word you're learning, not devotional script. */
  .sh-ar{font-family:var(--arabic); direction:rtl; text-align:left;
    font-size:clamp(34px, 5.4vw, 52px); line-height:1.16; color:var(--ink)}
  .sh-en{font-family:var(--sans); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gc); font-weight:600}
  /* Full-bleed out of the page gutter so the horizon runs edge to edge, as on the home page. */
  .sh-band{position:relative; margin:0 calc(50% - 50vw) 0; pointer-events:none;
    border-bottom:1px solid var(--rule)}
  /* Same sizing as the home page's skyband — meet (never slice) so nothing is cropped, and
     tall enough that a 1200x210 drawing fills the width instead of floating in side gaps. */
  .sh-sky{display:block; width:100%; height:17.5vw; max-height:200px; min-height:112px}
  /* The note in the corner. Anchored to the text column, not the full-bleed band, so it sits
     under the drawing's lower-right rather than out at the window edge. */
  .sh-cap{position:absolute; right:0; bottom:8px; max-width:min(62%,470px); text-align:right;
    font-family:var(--sans); font-size:10.5px; line-height:1.45; color:var(--muted);
    pointer-events:none; text-shadow:0 0 5px var(--paper), 0 0 9px var(--paper)}
  .sh-cap b{color:var(--ink-soft); font-weight:600}
  .sh-cap .ar{font-family:var(--arabic); font-size:12.5px; color:var(--ink-soft)}
  @media (max-width:640px){ .sh{margin-bottom:14px} .sh-in{padding:10px 0 8px}
    .sh-sky{height:30vw; min-height:96px}
    .sh-cap{position:static; max-width:100%; margin-top:5px; font-size:9.5px; text-shadow:none}
    .sh-cap .ar{font-size:11px} }
  @media print{ .sh-band, .sh-cap{display:none} }
  /* duplicate-merge review */
  .mg-nudge{margin:14px 0 4px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.6;
    background:var(--ochre-wash); border:1px solid var(--ochre); color:var(--ink)}

  .mg-ar{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:19px; min-width:5em}

  .mg-st{font-size:11.5px; color:var(--muted); font-family:var(--mono)}

  .wc-banks b{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:14px; color:var(--ink-soft); font-weight:400}
  /* shown on a word tapped in the Van Dyck Bible — readable, not bankable */

  /* a question carried in from a selection, waiting on a key */

    background:var(--ochre-wash); border:1px solid var(--ochre); color:var(--ink)}

  /* embedded YouTube (Videos section) — responsive 16:9, rounded to match the app */

    border-radius:12px; overflow:hidden; border:1px solid var(--paper-3)}
  .yt-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .yt-meta{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;

  /* plan extras: streak, warm-up, record, and the dashboard */
  .streak{font-size:12px; color:var(--ochre); font-weight:600; margin-right:8px}
  .warmup, .recard{border:1px solid var(--rule); border-radius:9px; padding:12px 14px; margin-bottom:14px; background:var(--paper-2)}
  .warmup.done, .recard.done{opacity:.6}
  .warmup-h{display:flex; align-items:center; gap:10px}
  .warmup-t{font-weight:600; flex:1}
  .wex{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:14px}
  .wex-q{flex:1; color:var(--muted)}
  .wex-a{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:18px; color:var(--ink)}
  #recBtn.rec-on{background:var(--brick,#B4372A); color:#fff}

  .dchart{display:flex; align-items:flex-end; gap:5px; height:120px; padding:6px 2px 0}

  .dbar-x{font-size:9px; color:var(--muted); margin-top:4px}

  @media print {
    .top, .tray, .sidebar, .side-scrim, .bk-noprint { display:none !important; }
    html, body { background:#fff !important; color:#000 !important; }
    .wrap, #view { margin:0 !important; padding:0 !important; max-width:none !important; }

    display:flex; flex-direction:column; justify-content:center; transition:border-color .2s,background .2s}

    color:var(--muted); margin-bottom:14px}
  .gs-listen .gs-phase{color:var(--verdigris)}
  .gs-turn .gs-phase{color:var(--ochre)}
  .gs-ar{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:30px; line-height:1.7; color:var(--ink)}
  .gs-en{font-size:13.5px; color:var(--muted); margin-top:10px; line-height:1.5}

  .gs-done-t{font-family:var(--serif); font-size:24px; color:var(--verdigris); margin-bottom:8px}

  /* ---- Ask a Tutor (BYOK chat) ---- */
  .tut-log{display:flex; flex-direction:column; gap:12px; margin:6px 0 16px}

    white-space:normal; word-wrap:break-word}
  .tut-b.me{align-self:flex-end; background:var(--verdigris); color:#fff; border-bottom-right-radius:5px}

    border:1px solid var(--rule); border-bottom-left-radius:5px}
  .tut-b.err{align-self:flex-start; background:var(--ochre-wash); color:var(--ink-soft);
    border:1px solid var(--ochre); font-size:13px}
  .tut-b b{font-weight:700}
  .tut-b .rt{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:1.15em}
  .tut-dots{align-self:flex-start; color:var(--muted); font-size:20px; letter-spacing:3px;
    padding:6px 4px}
  .tut-row{display:flex; gap:8px; align-items:flex-end; margin-top:4px}
  .tut-row textarea{flex:1; font:inherit; font-size:15px; line-height:1.4; padding:10px 12px;
    border:1px solid var(--rule); border-radius:12px; background:var(--paper-2); color:var(--ink);
    resize:none; min-height:44px; max-height:140px}
  .tut-row textarea:focus{outline:2px solid var(--verdigris); outline-offset:1px}
  .tut-send{font:inherit; font-size:14px; padding:11px 16px; border-radius:12px;
    border:1px solid var(--verdigris); background:var(--verdigris); color:#fff; cursor:pointer;
    white-space:nowrap}

  .tut-chip{font:inherit; font-size:12.5px; text-align:left; padding:9px 12px; border-radius:10px;

  .tut-chip:hover{border-color:var(--verdigris); background:var(--verdigris-2)}

  .tut-saves{align-self:flex-start; max-width:88%; margin:-4px 0 2px; display:flex;

  .tut-save .rt{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:1.12em}
  .tut-loop{font-size:12.5px; color:var(--ink-soft); border:1px solid var(--verdigris);

  /* ---- Lessons (native-sourced teaching units) ---- */
  .refsrc{font-size:12px; line-height:1.55; color:var(--ink-soft); border:1px solid var(--verdigris);
    background:var(--verdigris-2); border-radius:5px; padding:10px 12px; margin-bottom:18px}
  .refsrc b{color:var(--verdigris)}
  .lsn-title{font-family:var(--arabic); font-size:30px; direction:rtl; text-align:left}

    align-items:start; padding:9px 0; border-bottom:1px solid var(--rule)}

  /* ---- interactive teaching units ------------------------------------------------------ */
  /* The workbook look: a numbered item, the sentence with a gap in it, the English under it,

  .lsn-b{margin:22px 0 26px}
  .lsn-bh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
          border-bottom:1px solid var(--rule); padding-bottom:6px; margin-bottom:10px}
  /* No `direction` here, for the same reason as .gsub above: a teach-block heading is a MIXED
     line — "שלום is the one nobody says" — and the ones that are target-language throughout
     carry their own dir="rtl" from the renderer. Forcing rtl on all of them would read the
     English half backwards. */
  .lsn-bh span{font-family:var(--arabic); font-size:19px; color:var(--ink)}
  .lsn-bh em{font-style:normal; font-size:12.5px; color:var(--muted); letter-spacing:.04em;
             text-transform:uppercase}
  .lsn-teach p{margin:0 0 10px}
  .lsn-teach b{unicode-bidi:plaintext}   /* same as .gbody b above */
  .lsn-eg{background:var(--paper-2); border:1px solid var(--rule); border-radius:8px;
          padding:8px 12px; margin:0 0 14px; font-size:15px}
  .lsn-eg b{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; color:var(--ochre); margin-inline-end:10px}
  .lsn-item{display:grid; grid-template-columns:26px 1fr; gap:4px 8px; align-items:start;
            padding:9px 0; border-bottom:1px dashed var(--rule)}
  .lsn-item.ok{background:color-mix(in srgb, var(--verdigris) 7%, transparent)}
  .lsn-n{color:var(--muted); font-size:12px; padding-top:6px; font-variant-numeric:tabular-nums}
  .lsn-q,.lsn-built,.lsn-bank,.lsn-en,.lsn-a,.lsn-quizq,.lsn-opts,.lsn-why{grid-column:2}
  .lsn-q{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:19px; line-height:2.1}
  .lsn-en{font-size:12.5px; color:var(--muted)}
  .lsn-hint{display:block; color:var(--ochre)}
  .lsn-a{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:16px; color:var(--verdigris)}
  .lsn-in{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:17px; background:var(--paper-2);
          border:0; border-bottom:2px solid var(--ochre); color:var(--ink);
          width:6.5em; text-align:center; padding:1px 4px; border-radius:4px 4px 0 0}
  .lsn-in.wide{width:100%; text-align:right; margin-top:4px}
  .lsn-in:focus{outline:2px solid var(--verdigris); outline-offset:1px}
  .lsn-in.ok,.lsn-sel.ok{border-bottom-color:var(--verdigris); color:var(--verdigris)}
  .lsn-in.no,.lsn-sel.no,.lsn-built.no{border-bottom-color:var(--rubric)}
  .lsn-sel{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:16px; background:var(--paper-2); color:var(--ink);
           border:1px solid var(--rule); border-bottom:2px solid var(--ochre); border-radius:6px;
           padding:2px 6px}
  .lsn-ctl{margin-top:12px}
  /* vocabulary — מילים חדשות, sorted by part of speech the way Bet prints it */
  .lsn-voc{width:100%; border-collapse:collapse; font-size:14.5px}
  .lsn-voc td{border-bottom:1px solid var(--rule); padding:7px 6px; vertical-align:top}
  .lv-he{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:19px; white-space:nowrap}
  .lv-prep{color:var(--ochre); margin-inline-start:6px; font-size:16px}
  .lv-say{color:var(--muted); font-size:12.5px; font-family:var(--sans)}
  .lv-lex{display:block; color:var(--muted); font-size:11.5px}
  .lv-pos{color:var(--muted); font-size:11.5px; text-align:end}
  .lv-add{width:32px; text-align:end}
  /* the slang card, in HebrewPod's shape: literal, then meaning, then when you would say it */
  .lsn-slang{border:1px solid var(--ochre); border-radius:10px; padding:14px 16px;
             background:color-mix(in srgb, var(--ochre) 6%, transparent)}
  .lsn-sl-he{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:26px; line-height:1.6}
  .lsn-sl-lit{color:var(--muted); font-size:12.5px; margin-top:2px}
  .lsn-sl-mean{font-size:17px; color:var(--ochre); margin:6px 0 2px}
  .lsn-sl-when{font-size:13.5px; margin:6px 0 10px}
  /* match and order boards */
  .lsn-match{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .lsn-mcol{display:flex; flex-direction:column; gap:6px}
  .lsn-tile{background:var(--paper-2); border:1px solid var(--rule); border-radius:8px;
            color:var(--ink); padding:7px 10px; font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:16px;
            cursor:pointer; text-align:center}
  /* The English half of the matching exercise reuses the tile. It must NOT inherit the rtl
     the tile now carries for its target-language twin, or "How are you?" renders with the
     question mark on the left. */
  .lsn-tile.en{font-family:var(--sans); font-size:13.5px; direction:ltr; unicode-bidi:isolate}
  .lsn-tile.sel{border-color:var(--verdigris); outline:2px solid var(--verdigris)}
  .lsn-tile.ok{border-color:var(--verdigris); color:var(--verdigris); opacity:.55; cursor:default}
  .lsn-tile.small{padding:3px 8px; font-size:15px; cursor:default}
  .lsn-built{min-height:34px; display:flex; flex-wrap:wrap; gap:5px; padding:4px;
             border-bottom:2px solid var(--ochre)}
  .lsn-bank{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .lsn-ph{color:var(--muted); font-size:12.5px; font-family:var(--sans)}
  /* quiz */
  .lsn-quizq{font-size:15px; margin-bottom:6px}
  .lsn-opts{display:flex; flex-direction:column; gap:6px}
  .lsn-opt{background:var(--paper-2); border:1px solid var(--rule); border-radius:8px;
           color:var(--ink); padding:8px 11px; text-align:start; cursor:pointer; font-size:14px}
  .lsn-opt.ok{border-color:var(--verdigris); color:var(--verdigris)}
  .lsn-opt.no{border-color:var(--rubric); color:var(--rubric)}
  .lsn-why{font-size:12.5px; color:var(--muted); margin-top:6px}
  /* the conjugation grid — printed cells plain, blanks as inputs */
  .lsn-grid{width:100%; border-collapse:collapse; margin:4px 0 2px}
  .lsn-grid th{font-family:var(--arabic); font-size:14px; font-weight:400; color:var(--muted);
               border-bottom:1px solid var(--rule); padding:5px 6px; text-align:center}
  .lsn-grid td{border-bottom:1px solid var(--rule); padding:5px 6px; text-align:center}
  .lg-given{font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:17px; color:var(--muted)}
  .lsn-in.grid{width:100%; min-width:5.5em; text-align:center}
  .lg-a{display:block; font-family:var(--arabic); direction:rtl; unicode-bidi:isolate; font-size:13px; color:var(--verdigris)}
  @media (max-width:560px){
    .lsn-match{grid-template-columns:1fr}
    .lsn-grid th,.lsn-grid td{padding:4px 3px}
    .lsn-grid th{font-size:12px}
    .lg-given{font-size:15px}
    .lsn-in.grid{min-width:4.2em; font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="ham" id="ham" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="title" onclick="location.hash='/'" style="cursor:pointer">Arabrit</h1>
    <span class="sp"></span>
    <span id="langsw"></span>
    <button class="back" id="back" hidden>&larr; Back</button>
  </div>
  <aside class="sidebar" id="sidebar" aria-hidden="true" aria-label="Sections">
    <div class="side-brand" id="sideBrand"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>
  <div id="view"></div>
</div>

<div class="cardwrap" id="cw"><div class="scrim" id="scrim"></div><div class="wc" id="wc"></div></div>

<div class="tray"><div class="in">
  <span class="n"><b id="cnt">0</b> <span id="cntlbl">due</span></span>
  <span class="sp"></span>
  <button id="rev">Review</button>
  <button class="go" id="exp">Export</button>
</div></div>

<script>
/* The load list, written where the tags used to be.
 *
 * document.write, and deliberately: these scripts assign to globals that app.js reads at its own
 * top level, and app.js touches the DOM as soon as it runs, so the order is "all the data, then
 * the pack, then app.js, and all of it after the body". A parser-inserted write at this exact
 * point is the only injection that guarantees both halves of that; scripts appended to <head>
 * with async=false keep their order relative to each other but not relative to a parser-inserted
 * tag further down the document. The Chrome intervention that blocks document.write'n scripts
 * applies to cross-origin ones on slow connections; every path here is relative.
 *
 * <script src>, not fetch: opened by double-click the page runs on file://, where fetch() of a
 * sibling file is a CORS error. A script tag has no such restriction, which is the whole reason
 * the pipeline emits .js instead of .json. */
(function () {
  const L = window.ALP.lang;
  if (!L) return window.ALP.chooser();          // nobody has chosen yet -- load nothing
  const files = ['vendor/supabase.js', 'data/supaconfig.js', 'data/pushconfig.js']
    .concat(L.data.map(n => 'data/' + L.code + '/' + n + '.js'))
    .concat(['lang/define.js', 'lang/scenery.js', 'lang/' + L.code + '.js', 'app.js']);
  document.write(files.map(f => '<scr' + 'ipt src="' + f + window.ALP_V +
                                '"></scr' + 'ipt>').join(''));
})();
</script>
</body>
